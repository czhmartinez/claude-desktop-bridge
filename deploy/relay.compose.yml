services:
  relay:
    build:
      context: ./source
      dockerfile: deploy/relay.Dockerfile
    container_name: bridge-relay
    restart: unless-stopped
    environment:
      BRIDGE_RELAY_HOST: 0.0.0.0
      BRIDGE_RELAY_PORT: 8788
      BRIDGE_RELAY_DATA: /data/bridge-relay.db
      BRIDGE_RELAY_BACKUP_DIR: /data/backups
      BRIDGE_TRUST_PROXY: "1"
      BRIDGE_ALLOWED_ORIGINS: ${BRIDGE_ALLOWED_ORIGINS}
      BRIDGE_RELAY_MAX_FRAMES_PER_MINUTE: ${BRIDGE_RELAY_MAX_FRAMES_PER_MINUTE:-6000}
    expose:
      - "8788"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - bridge-relay-data:/data

  web:
    build:
      context: ./source
      dockerfile: deploy/web.Dockerfile
    container_name: bridge-web
    restart: unless-stopped
    expose:
      - "80"

volumes:
  bridge-relay-data:

networks:
  default:
    name: ${BRIDGE_RELAY_NETWORK}
    external: true

# ---------------------------------------------------------------------------
# 可选：Cloudflare Tunnel（海外 relay 形态，relay.alioxis.uk 的现网配置）。
# 场景：relay 部署在海外 VPS（如 DMIT LA），只通过 Cloudflare 隧道入站，
# 主机不暴露任何 relay 端口。
#
#   tunnel:
#     image: cloudflare/cloudflared:latest
#     container_name: bridge-tunnel-uk
#     restart: unless-stopped
#     volumes:
#       - /etc/cloudflared-uk:/etc/cloudflared:ro
#     command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
#
# /etc/cloudflared-uk/ 需要两个文件（CLI 本地管理隧道，凭证从
# `cloudflared tunnel create` 的机器上复制）：
#   config.yml:
#     tunnel: <tunnel-uuid>
#     credentials-file: /etc/cloudflared/<tunnel-uuid>.json
#     no-autoupdate: true
#     ingress:
#       - hostname: relay.alioxis.uk
#         service: http://bridge-relay:8788
#       - service: http_status:404
#   <tunnel-uuid>.json（chmod 644，容器内非 root 用户要可读）
# 隧道容器必须与 relay 容器在同一 docker network，且该 network 里有
# `bridge-relay` 别名（compose 默认 network 自带）。
# ---------------------------------------------------------------------------
