services:
  relay:
    build:
      context: .
      dockerfile: deploy/relay.Dockerfile
    restart: unless-stopped
    environment:
      BRIDGE_RELAY_HOST: 0.0.0.0
      BRIDGE_RELAY_PORT: 8788
      BRIDGE_RELAY_DATA: /data/relay-store.json
      BRIDGE_ALLOWED_ORIGINS: https://${BRIDGE_DOMAIN}
    volumes:
      - relay-data:/data

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - relay
      - web
    environment:
      BRIDGE_DOMAIN: ${BRIDGE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  relay-data:
  caddy-data:
  caddy-config:
