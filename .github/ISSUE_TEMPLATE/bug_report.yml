name: Bug report
description: Report a reproducible issue in Bridge.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Bridge version from the desktop about screen or package.json.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Desktop runtime
      options:
        - Claude Desktop
        - Codex Desktop
        - Hermes Desktop
        - Multiple / relay
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include pairing, network, and device details if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs or attach screenshots. Redact credentials first.
