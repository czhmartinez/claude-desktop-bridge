name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "apps/mobile/android/app/build.gradle"
      - "apps/mobile/ios/App/App.xcodeproj/project.pbxproj"

permissions:
  contents: read

concurrency:
  group: bridge-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inspect release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(jq -er '.version | select(type == "string")' package.json)"
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $CURRENT_VERSION" >&2
            exit 1
          fi

          TAG="v${CURRENT_VERSION}"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              echo "Tag $TAG exists without a Release; resuming publication."
            else
              echo "New version detected: $TAG"
            fi
          fi

      - name: Validate synchronized versions
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const releaseVersion = process.env.RELEASE_VERSION;
          const manifestFiles = [
            "package.json",
            "apps/client/package.json",
            "apps/desktop/package.json",
            "apps/mobile/package.json",
            "apps/relay/package.json",
            "packages/protocol/package.json",
          ];
          const failures = [];

          for (const file of manifestFiles) {
            const manifest = JSON.parse(readFileSync(file, "utf8"));
            if (manifest.version !== releaseVersion) {
              failures.push(`${file}: version ${manifest.version ?? "<missing>"}`);
            }
            for (const group of ["dependencies", "devDependencies", "peerDependencies"]) {
              for (const [name, version] of Object.entries(manifest[group] ?? {})) {
                if (name.startsWith("@bridge/") && version !== releaseVersion) {
                  failures.push(`${file}: ${group}.${name} ${version}`);
                }
              }
            }
          }

          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const lockPackages = [
            "",
            "apps/client",
            "apps/desktop",
            "apps/mobile",
            "apps/relay",
            "packages/protocol",
          ];
          for (const path of lockPackages) {
            const version = lock.packages?.[path]?.version;
            if (version !== releaseVersion) {
              failures.push(`package-lock.json packages[${JSON.stringify(path)}]: ${version ?? "<missing>"}`);
            }
          }

          const android = readFileSync("apps/mobile/android/app/build.gradle", "utf8");
          const androidVersion = android.match(/versionName\s+"([^"]+)"/u)?.[1];
          if (androidVersion !== releaseVersion) {
            failures.push(`Android versionName: ${androidVersion ?? "<missing>"}`);
          }

          const ios = readFileSync("apps/mobile/ios/App/App.xcodeproj/project.pbxproj", "utf8");
          const iosVersions = new Set(
            [...ios.matchAll(/MARKETING_VERSION = ([^;]+);/gu)].map((match) => match[1]?.trim()),
          );
          if (iosVersions.size !== 1 || !iosVersions.has(releaseVersion)) {
            failures.push(`iOS MARKETING_VERSION: ${[...iosVersions].join(", ") || "<missing>"}`);
          }

          if (failures.length > 0) {
            console.error(`Release version ${releaseVersion} is not synchronized:`);
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }

          console.log(`All release versions match ${releaseVersion}.`);
          NODE

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run verify

      - name: Create draft GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${VERSION}"
          # Draft-first: release-assets.yml attaches every platform artifact to
          # this draft and only then publishes, which keeps the flow compatible
          # with immutable releases. gh release create also creates the tag;
          # the releases endpoint accepts GITHUB_TOKEN where the raw git refs
          # API answers HTTP 422.
          gh release create "$TAG" \
            --draft \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release $TAG" \
            --notes "Platform builds in progress; published automatically once all assets land."

      - name: Dispatch platform asset builds on the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${VERSION}"
          # Tags created with GITHUB_TOKEN never fire push:tags triggers, so the
          # standing platform build (macOS/Windows/Linux installers, Android
          # APK, iOS simulator and unsigned device apps, then the GitHub
          # Release with all -ci assets) is dispatched explicitly on the tag.
          gh workflow run release-assets.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
