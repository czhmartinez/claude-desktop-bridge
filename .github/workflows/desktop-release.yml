name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    env:
      BRIDGE_RELAY_URL: ${{ vars.BRIDGE_RELAY_URL }}
      BRIDGE_PAIRING_BASE_URL: ${{ vars.BRIDGE_PAIRING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - run: npm ci
      - run: npm run build -w @bridge/protocol
      - run: npm run make -w @bridge/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-${{ matrix.name }}
          path: apps/desktop/out/make/**
