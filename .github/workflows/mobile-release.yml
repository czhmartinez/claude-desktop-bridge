name: Mobile builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build -w @bridge/protocol
      - run: npm run sync -w @bridge/mobile
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Assert Android APK output
        shell: bash
        run: |
          set -euo pipefail
          test -f "apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk" \
            || { echo "Missing debug APK"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-Android-debug-ci
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG not found; keeping workflow artifacts only."
            exit 0
          fi
          version="$(jq -er '.version' apps/mobile/package.json)"
          asset="$RUNNER_TEMP/Bridge-${version}-android-debug-ci.apk"
          cp "apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk" "$asset"
          gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @bridge/protocol
      - name: Build unsigned simulator app
        run: npm run build:ios:simulator -w @bridge/mobile
      - name: Build unsigned device app
        run: npm run build:ios:device -w @bridge/mobile
      - name: Assert iOS build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -d "apps/mobile/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app" \
            || { echo "Missing simulator App.app"; exit 1; }
          test -d "apps/mobile/ios/DerivedData-device/Build/Products/Debug-iphoneos/App.app" \
            || { echo "Missing unsigned device App.app"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-iOS-simulator-ci
          path: apps/mobile/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-iOS-device-unsigned-ci
          path: apps/mobile/ios/DerivedData-device/Build/Products/Debug-iphoneos/App.app
      - name: Attach iOS apps to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG not found; keeping workflow artifacts only."
            exit 0
          fi
          version="$(jq -er '.version' apps/mobile/package.json)"
          simulator_zip="$RUNNER_TEMP/Bridge-${version}-ios-simulator-ci.zip"
          device_zip="$RUNNER_TEMP/Bridge-${version}-ios-device-unsigned-ci.zip"
          ditto -c -k --keepParent \
            "apps/mobile/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app" \
            "$simulator_zip"
          ditto -c -k --keepParent \
            "apps/mobile/ios/DerivedData-device/Build/Products/Debug-iphoneos/App.app" \
            "$device_zip"
          gh release upload "$TAG" "$simulator_zip" "$device_zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
